services:
  #####################
  # Database + Broker #
  #####################
  db: # Core database of our app
    image: postgres:17.6-alpine3.22 # Always use fixed version
    restart: always
    command: -c 'config_file=/etc/postgresql/postgresql.conf'
    environment:
      PGDATA: /var/lib/postgresql/data
    env_file:
      - path: ./.env/database.env
        required: true
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d # Add initial scripts
      - ./db/config:/etc/postgresql # Add config files
      # Note: Starting from the next version
      # 'data/' at the end should be omitted.
      # https://github.com/docker-library/postgres/pull/1259
      - ./db/data:/var/lib/postgresql/data # Add database files
    networks:
      # TODO: Use aliases
      - db
      - backend
    shm_size: 128mb # Set shared memory limit when using docker compose
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$DB_NAME -U $$DB_USER"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - "5432:5432" # Port forwarding
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:8.8.0-alpine
    restart: always
    # TODO: Change it
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    build:
      context: ./infra/minio
      dockerfile: Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command:
      - server
      - /data
      - --console-address
      - :9001
    env_file:
      - path: ./.env/storage.env
        required: true
    volumes:
      - minio-data:/data
    networks:
      - backend
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  adminer: # Simple db web-manager
    image: adminer:5.4.1-standalone
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - db
    ports:
      - "8080:8080"

  #######################
  # DJango + Celery app #
  #######################
  migrate:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command:
      - python
      - manage.py
      - migrate
      - --noinput
    environment:
      DB_HOST: db
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
      - path: ./.env/storage.env
        required: false
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - backend
    restart: "no"

  object-storage-init:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command: ["python", "manage.py", "ensure_object_storage"]
    environment:
      DB_HOST: db
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
      - path: ./.env/storage.env
        required: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
        restart: true
    networks:
      - backend
    restart: "no"

  builder-model-init:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command: ["python", "manage.py", "train_builder_models"]
    environment:
      DB_HOST: db
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
      - path: ./.env/storage.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
        restart: true
    networks:
      - backend
    restart: "no"

  celery-worker:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command:
      - bash
      - -ec
      - |
        summary_queue="$${SEARCH_TASK_QUEUE:-catalog-search}"
        detail_queue="$${SEARCH_DETAIL_TASK_QUEUE:-catalog-detail}"
        exec celery -A config worker \
          --loglevel=INFO \
          --concurrency="$${CELERY_WORKER_CONCURRENCY:-2}" \
          --max-tasks-per-child=100 \
          --hostname="catalog@%h" \
          --include=apps.search.tasks \
          --queues="$$summary_queue,$$detail_queue"
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
      - path: ./.env/sources.env
        required: false
      - path: ./.env/storage.env
        required: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        restart: true
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 75s
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d catalog@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  celery-import-worker:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command:
      - bash
      - -ec
      - |
        import_queue="$${DATASET_IMPORT_QUEUE:-dataset-import}"
        exec celery -A config worker \
          --loglevel=INFO \
          --concurrency="$${DATASET_IMPORT_WORKER_CONCURRENCY:-1}" \
          --max-tasks-per-child=20 \
          --hostname="dataset-import@%h" \
          --include=apps.datasets.tasks \
          --queues="$$import_queue"
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
      - path: ./.env/sources.env
        required: false
      - path: ./.env/storage.env
        required: true
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        restart: true
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d dataset-import@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  celery-analysis-worker:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command:
      - bash
      - -ec
      - |
        analysis_queue="$${BUILDER_ANALYSIS_QUEUE:-dataset-analysis}"
        exec celery -A config worker \
          --loglevel=INFO \
          --concurrency="$${BUILDER_ANALYSIS_WORKER_CONCURRENCY:-1}" \
          --max-tasks-per-child=10 \
          --hostname="dataset-analysis@%h" \
          --include=apps.builder.tasks \
          --queues="$$analysis_queue"
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
      - path: ./.env/storage.env
        required: true
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
        restart: true
      builder-model-init:
        condition: service_completed_successfully
        restart: true
      redis:
        condition: service_healthy
        restart: true
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test:
        ["CMD-SHELL", "celery -A config inspect ping -d dataset-analysis@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery-builder-worker:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command:
      - bash
      - -ec
      - |
        builder_queue="$${BUILDER_QUEUE:-dataset-builder}"
        exec celery -A config worker \
          --loglevel=INFO \
          --concurrency="$${BUILDER_WORKER_CONCURRENCY:-1}" \
          --max-tasks-per-child=5 \
          --hostname="dataset-builder@%h" \
          --include=apps.builder.tasks \
          --queues="$$builder_queue"
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
      - path: ./.env/storage.env
        required: true
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
        restart: true
      builder-model-init:
        condition: service_completed_successfully
        restart: true
      redis:
        condition: service_healthy
        restart: true
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 180s
    healthcheck:
      test:
        ["CMD-SHELL", "celery -A config inspect ping -d dataset-builder@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  builder-analysis-init:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command: ["python", "manage.py", "enqueue_builder_analyses"]
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
      - path: ./.env/storage.env
        required: true
    depends_on:
      celery-analysis-worker:
        condition: service_healthy
        restart: true
      builder-model-init:
        condition: service_completed_successfully
        restart: true
    networks:
      - backend
    restart: "no"

  medagg-app:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command:
      - python
      - manage.py
      - runserver
      - 0.0.0.0:8000
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check --fail-level ERROR"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      DB_HOST: db # Network inside compose
      CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
      - path: ./.env/sources.env
        required: false
      - path: ./.env/storage.env
        required: true
    ports:
      - "8000:8000"
    depends_on:
      object-storage-init:
        condition: service_completed_successfully
        restart: true
      builder-model-init:
        condition: service_completed_successfully
        restart: true
      builder-analysis-init:
        condition: service_completed_successfully
        restart: true
      redis:
        condition: service_healthy
        restart: true
      celery-worker:
        condition: service_healthy
        restart: true
      celery-import-worker:
        condition: service_healthy
        restart: true
      celery-analysis-worker:
        condition: service_healthy
        restart: true
      celery-builder-worker:
        condition: service_healthy
        restart: true
      db:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    networks:
      # TODO: Use aliases
      - backend

  tests:
    profiles: ["test"]
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command:
      - bash
      - -ec
      - |
        echo "Running Django system checks..."
        python manage.py check --fail-level ERROR
        echo "Checking for missing migrations..."
        python manage.py makemigrations --check --dry-run
        echo "Running tests..."
        python -Wa manage.py test --noinput --failfast --verbosity 2
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: memory://
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
      - path: ./.env/storage.env
        required: false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

volumes:
  redis-data:
  minio-data:

networks:
  backend:
    driver: bridge
  db:
    driver: bridge
