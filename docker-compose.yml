services:
  ####################
  # Database + Cache #
  ####################
  db: # Core database of our app
    image: postgres:17.6-alpine3.22 # Always use fixed version
    restart: always
    command: -c 'config_file=/etc/postgresql/postgresql.conf'
    environment:
      PGDATA: /var/lib/postgresql/data
    env_file:
      - path: ./.env/database.env
        required: true
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d # Add initial scripts
      - ./db/config:/etc/postgresql # Add config files
      # Note: Starting from the next version
      # 'data/' at the end should be omitted.
      # https://github.com/docker-library/postgres/pull/1259
      - ./db/data:/var/lib/postgresql/data # Add database files
    networks:
      # TODO: Use aliases
      - db
      - backend
    shm_size: 128mb # Set shared memory limit when using docker compose
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $$DB_NAME -U $$DB_USER"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - "5432:5432" # Port forwarding
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M
      placement:
        constraints:
          - node.role == manager

  redis:
    image: redis:8.8.0-alpine
    restart: always
    # TODO: Change it
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  adminer: # Simple db web-manager
    image: adminer:5.4.1-standalone
    restart: always
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - db
    ports:
      - "8080:8080"

  #######################
  # DJango + Celery app #
  #######################
  migrate:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command:
      - python
      - manage.py
      - migrate
      - --noinput
    environment:
      DB_HOST: db
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
    depends_on:
      db:
        condition: service_healthy
        restart: true
    networks:
      - backend
    restart: "no"

  celery-worker:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command:
      - bash
      - -ec
      - |
        summary_queue="$${SEARCH_TASK_QUEUE:-catalog-search}"
        detail_queue="$${SEARCH_DETAIL_TASK_QUEUE:-catalog-detail}"
        exec celery -A config worker \
          --loglevel=INFO \
          --concurrency="$${CELERY_WORKER_CONCURRENCY:-2}" \
          --max-tasks-per-child=100 \
          --hostname="celery@%h" \
          --include=apps.search.tasks \
          --queues="$$summary_queue,$$detail_queue"
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
      - path: ./.env/sources.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        restart: true
    networks:
      - backend
    restart: unless-stopped
    stop_grace_period: 75s
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  medagg-app:
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command:
      - python
      - manage.py
      - runserver
      - 0.0.0.0:8000
    healthcheck:
      test: ["CMD-SHELL", "python manage.py check --fail-level ERROR"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      DB_HOST: db # Network inside compose
      CELERY_BROKER_URL: redis://redis:6379/0
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
      - path: ./.env/sources.env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app  # Синхронизирует всю папку src с /app
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
        restart: true
      celery-worker:
        condition: service_healthy
        restart: true
      db:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    networks:
      # TODO: Use aliases
      - backend

  tests:
    profiles: ["test"]
    build:
      context: .
      target: prod
      dockerfile: Dockerfile
    command:
      - bash
      - -ec
      - |
        echo "Running Django system checks..."
        python manage.py check --fail-level ERROR
        echo "Checking for missing migrations..."
        python manage.py makemigrations --check --dry-run
        echo "Running tests..."
        python -Wa manage.py test --noinput --failfast --verbosity 2
    environment:
      DB_HOST: db
      CELERY_BROKER_URL: memory://
    env_file:
      - path: ./.env/settings.env
        required: true
      - path: ./.env/database.env
        required: true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

volumes:
  redis-data:

networks:
  backend:
    driver: bridge
  db:
    driver: bridge
